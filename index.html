<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;line-height:1.6}
header{background:#185fa5;color:#fff;padding:32px 20px 26px}

<script>
function f(){var k=document.getElementById('q').value.trim().toLowerCase();
document.querySelectorAll('.card').forEach(function(c){

document.querySelectorAll('.cat').forEach(function(h){
